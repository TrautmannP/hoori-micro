# Single-host, unauthenticated development demonstration. Not a production deployment.
# Only the gateway has a host port; registry and services live on the internal backend net.
name: hoori-micro-demo
x-common: &common
  platform: linux/amd64
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 15s
  healthcheck:
    test: [CMD-SHELL, 'curl -fsS --max-time 2 http://127.0.0.1:8080/health/ready >/dev/null']
    interval: 5s
    timeout: 3s
    start_period: 30s
    retries: 20
x-env: &env
  HOORI_ENGINE: ${HOORI_ENGINE:-mixed}
  # Deliberately relaxed DEMO deadlines for debug/cold-compilation qualification.
  # Framework defaults remain client=2s and inbound=10s.
  HOORI_CLIENT_TIMEOUT_MS: ${HOORI_DEMO_CLIENT_TIMEOUT_MS:-30000}
  HOORI_REQUEST_TIMEOUT_MS: ${HOORI_DEMO_REQUEST_TIMEOUT_MS:-60000}
  HOORI_SHUTDOWN_GRACE_MS: 10000
x-build: &build
  context: .docker-context
x-after-registry: &after-registry
  registry:
    condition: service_healthy
services:
  registry:
    <<: *common
    build:
      <<: *build
      args: {SERVICE: registry, RUNTIME_BASE: '${HOORI_RUNTIME_BASE:-debian:trixie-slim@sha256:7792b1f7702a86946cd518db72b6a407302c3e9bc1635634368b878189e8221c}'}
    environment:
      <<: *env
      HOORI_MAIN_CLASS: hoori/micro/Registry
      HOORI_OUTBOUND: none
    networks: [backend]
  recipes:
    <<: *common
    build:
      <<: *build
      args: {SERVICE: recipes, RUNTIME_BASE: '${HOORI_RUNTIME_BASE:-debian:trixie-slim@sha256:7792b1f7702a86946cd518db72b6a407302c3e9bc1635634368b878189e8221c}'}
    environment:
      <<: *env
      HOORI_MAIN_CLASS: dev/hoori/micro/demo/RecipesMain
      HOORI_OUTBOUND: http
      # 1 simulates a later recipes release with an additional action.
      HOORI_DEMO_RECOMMEND: ${HOORI_DEMO_RECOMMEND:-0}
    depends_on: *after-registry
    networks: [backend]
  shopping:
    <<: *common
    build:
      <<: *build
      args: {SERVICE: shopping, RUNTIME_BASE: '${HOORI_RUNTIME_BASE:-debian:trixie-slim@sha256:7792b1f7702a86946cd518db72b6a407302c3e9bc1635634368b878189e8221c}'}
    environment:
      <<: *env
      HOORI_MAIN_CLASS: dev/hoori/micro/demo/ShoppingMain
      HOORI_OUTBOUND: http
    depends_on: *after-registry
    networks: [backend]
  gateway:
    <<: *common
    build:
      <<: *build
      args: {SERVICE: gateway, RUNTIME_BASE: '${HOORI_RUNTIME_BASE:-debian:trixie-slim@sha256:7792b1f7702a86946cd518db72b6a407302c3e9bc1635634368b878189e8221c}'}
    environment:
      <<: *env
      HOORI_MAIN_CLASS: hoori/micro/Gateway
      HOORI_OUTBOUND: http
      # Demo policy: grants these permissions to every caller. No authentication.
      HOORI_GATEWAY_PERMISSIONS: recipes:read,shopping:read,shopping:demo
    depends_on: *after-registry
    ports:
      - '127.0.0.1:${HOORI_DEMO_PORT:-8080}:8080'
    networks: [edge, backend]
networks:
  edge: {}
  backend:
    internal: true
